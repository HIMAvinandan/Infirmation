<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AVI – Patient home · Infirmation</title>
  <style>
    body{margin:0;background:#fff;color:#495762;font-family:Karla,Tahoma,Arial,sans-serif;line-height:1.65}
    .wrap{max-width:640px;margin:0 auto;padding:40px 20px 48px}
    h1{font-family:Montserrat,Tahoma,Arial,sans-serif;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin:0 0 8px}
    .sub{font-size:12px;color:#8193a1;margin:0 0 24px}
    .card{border:1px solid #eee;border-radius:8px;padding:18px 20px;margin:0 0 16px}
    .card h2{font-family:Montserrat,Tahoma,Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin:0 0 12px;color:#8193a1}
    .row{font-size:14px;margin:0 0 6px}
    .row strong{display:inline-block;min-width:110px;color:#8193a1;font-weight:600}
    .btn{display:inline-block;margin:6px 8px 6px 0;padding:10px 16px;background:#495762;color:#fff;text-decoration:none;font-family:Montserrat,Tahoma,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:3px}
    .btn.ghost{background:#fff;color:#495762;border:1px solid #495762}
    .warn{background:#fff8f0;border-left:4px solid #c90;padding:12px 14px;font-size:13px;margin:0 0 16px;display:none}
    .err{background:#fff5f5;border-left:4px solid #a33;padding:12px 14px;font-size:13px;margin:0 0 16px;display:none}
    #loading{font-size:14px;color:#8193a1}
    a{color:#495762;font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <div style="text-align:center;margin-bottom:8px">
      <img src="https://publinc.wordpress.com/wp-content/uploads/2024/08/shield-against-enemy.png" alt="AVI" width="90" style="display:block;margin:0 auto 12px;border:0">
      <h1>Patient home</h1>
      <p class="sub">One session · profile required</p>
    </div>
    <p id="loading">Loading…</p>
    <div id="errbox" class="err"></div>
    <div id="warn" class="warn"></div>
    <div id="panel" style="display:none">
      <div class="card">
        <h2>Your profile</h2>
        <p class="row"><strong>Name</strong> <span id="p-name">—</span></p>
        <p class="row"><strong>Email</strong> <span id="p-email">—</span></p>
        <p class="row"><strong>Phone</strong> <span id="p-phone">—</span></p>
        <p class="row"><strong>DOB</strong> <span id="p-dob">—</span></p>
        <p class="row"><strong>Status</strong> <span id="p-status">—</span></p>
        <p class="row"><strong>NDA</strong> <span id="p-nda">—</span></p>
      </div>
      <div class="card" id="reports-card">
        <h2>Reports</h2>
        <a class="btn" href="Reports/Age_Timeline_Patient_Form.html">Age / Incidental Timeline</a>
        <a class="btn" href="Reports/Patient_Drug_Use_Report_Form.html">Transfer / Drug report</a>
        <a class="btn ghost" href="index.html">Infirmation index</a>
      </div>
      <p style="font-size:12px;color:#9da4aa">
        <a href="#" id="sign-out">Sign out</a>
        · <a href="administrative-non-disclosure.html#register">Non-Disclosure</a>
      </p>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-app.js"></script>
  <script>
  (async function () {
    var loading = document.getElementById('loading');
    var warn = document.getElementById('warn');
    var errbox = document.getElementById('errbox');
    function doneLoading() {
      if (loading) loading.style.display = 'none';
    }
    function showErr(msg) {
      errbox.style.display = 'block';
      errbox.textContent = msg;
    }
    try {
      if (!window.InfirmationFB) {
        doneLoading();
        showErr('Helper script failed to load (js/firebase-app.js).');
        return;
      }
      var fb = InfirmationFB.ensureFirebase();
      if (!fb) {
        doneLoading();
        showErr('Firebase is not configured. Check js/firebase-config.js.');
        return;
      }
      var user = await InfirmationFB.requireAuth();
      if (!user) {
        window.location.replace('login.html?next=patient-home.html');
        return;
      }
      var patient = null;
      var readError = null;
      try {
        patient = await InfirmationFB.getPatientDoc(user.uid);
      } catch (e) {
        readError = e;
      }
      doneLoading();
      document.getElementById('panel').style.display = 'block';
      document.getElementById('p-name').textContent = (patient && patient.displayName) || user.displayName || '—';
      document.getElementById('p-email').textContent = (patient && patient.email) || user.email || '—';
      document.getElementById('p-phone').textContent = (patient && patient.phone) || '—';
      document.getElementById('p-dob').textContent = (patient && patient.dob) || '—';
      document.getElementById('p-status').textContent = (patient && patient.status) || 'auth only · no Firestore patient';
      document.getElementById('p-nda').textContent = patient
        ? ((patient.ndaVersion || '') + (patient.ndaAccepted ? ' · accepted' : ''))
        : '—';

      if (readError) {
        warn.style.display = 'block';
        warn.innerHTML = 'Firestore read failed: <code>' + (readError.message || readError) + '</code>. Common causes: rules not published, or database not in <strong>Native</strong> mode. Publish rules from the tight pack, then reload.';
      } else if (!patient) {
        warn.style.display = 'block';
        warn.innerHTML = 'Account is signed in, but there is <strong>no patient document</strong>. Open <a href="administrative-non-disclosure.html#register">Non-Disclosure → Agree &amp; create profile</a> once (name + accept). Then check Firestore → <code>patients</code>.';
      }

      document.getElementById('sign-out').addEventListener('click', async function (e) {
        e.preventDefault();
        await fb.auth.signOut();
        window.location.replace('login.html');
      });
    } catch (e) {
      doneLoading();
      showErr('Patient home error: ' + (e.message || e));
      console.error(e);
    }
  })();
  </script>
</body>
</html>
