<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AVI – Sign in · Infirmation</title>
  <style>
    body { margin: 0; background: #fff; color: #495762; font-family: Karla, Tahoma, Arial, sans-serif; line-height: 1.6; }
    .wrap { max-width: 420px; margin: 0 auto; padding: 40px 20px 48px; }
    h1 { font-family: Montserrat, Tahoma, Arial, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 8px; text-align: center; }
    .sub { font-size: 12px; color: #8193a1; text-align: center; margin: 0 0 24px; }
    label { display: block; font-family: Montserrat, Tahoma, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #8193a1; margin: 0 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #eee; border-radius: 4px; font-size: 15px; margin: 0 0 12px; color: #495762; }
    button, .btn {
      width: 100%; padding: 13px; border: 0; border-radius: 3px; background: #495762; color: #fff;
      font-family: Montserrat, Tahoma, Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; margin: 0 0 10px;
    }
    button:disabled { opacity: 0.6; }
    .btn-google { background: #fff; color: #495762; border: 1px solid #ddd; }
    .divider { text-align: center; font-size: 12px; color: #9da4aa; margin: 16px 0; }
    .err { color: #a33; font-size: 13px; margin: 0 0 12px; display: none; }
    .foot { margin-top: 20px; font-size: 12px; color: #9da4aa; text-align: center; }
    a { color: #495762; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="https://publinc.wordpress.com/wp-content/uploads/2024/08/shield-against-enemy.png" alt="AVI" width="90" style="display:block;margin:0 auto 14px;border:0;">
    <h1>Sign in</h1>
    <p class="sub">Email · Google · Infirmation Xone</p>
    <p id="err" class="err"></p>

    <button type="button" class="btn btn-google" id="btn-google">Continue with Google</button>

    <div class="divider">— or email —</div>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="btn">Sign in with email</button>
    </form>

    <p class="foot">
      New patient? <a href="nda-signup.html">Register under NDA</a><br>
      <a href="https://himavinandan.github.io/Infirmation/">← Infirmation</a>
    </p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-app.js"></script>
  <script>
  (function () {
    var err = document.getElementById('err');
    function showErr(msg) {
      err.textContent = msg || 'Something went wrong.';
      err.style.display = 'block';
    }
    function nextUrl() {
      return new URLSearchParams(location.search).get('next') || 'patient-home.html';
    }
    function goNext() { window.location.href = nextUrl(); }
    function fbOrFail() {
      var fb = InfirmationFB.ensureFirebase();
      if (!fb) {
        showErr('Firebase is not configured. Paste keys into js/firebase-config.js');
        return null;
      }
      return fb;
    }

    document.getElementById('btn-google').addEventListener('click', async function () {
      var fb = fbOrFail();
      if (!fb) return;
      try {
        var provider = new firebase.auth.GoogleAuthProvider();
        await fb.auth.signInWithPopup(provider);
        goNext();
      } catch (ex) {
        showErr(ex.message || 'Google sign-in failed');
      }
    });

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var fb = fbOrFail();
      if (!fb) return;
      var btn = document.getElementById('btn');
      btn.disabled = true;
      try {
        await fb.auth.signInWithEmailAndPassword(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        goNext();
      } catch (ex) {
        showErr(ex.message || 'Sign-in failed');
        btn.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
